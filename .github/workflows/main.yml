name: NodeJS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install

    - name: Retrieve version
      run: |
        echo "::set-output name=VERSION_NAME::$(node -e 'console.log(require("./package.json").version)')"
      id: package_version

    - name: Put version to github env
      run: |
        echo "version_name=${{steps.package_version.outputs.VERSION_NAME}}" >> $GITHUB_ENV

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{env.version_name}}
        release_name: v${{env.version_name}}
        draft: false
        prerelease: false
