name: NodeJS CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: | 
        npm install
        npm run build

    - name: Put version to github env
      run: echo VERSION_NAME=$(node -e 'console.log(require("./package.json").version)') >> $GITHUB_ENV

    - name: Fail if version is empty
      if: ${{ env.VERSION_NAME == '' }}
      run: exit 1

    - name: Create Release
      run: gh release create v${{ env.VERSION_NAME }} dist/bundle.js
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
